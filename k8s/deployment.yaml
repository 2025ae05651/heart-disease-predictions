apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-prediction
  labels:
    app: heart-disease-prediction
spec:
  replicas: 3
  selector:
    matchLabels:
      app: heart-disease-prediction
  template:
    metadata:
      labels:
        app: heart-disease-prediction
    spec:
      containers:
      - name: heart-disease-api
        image: heart-disease-prediction:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-prediction-service
  labels:
    app: heart-disease-prediction
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: heart-disease-prediction
