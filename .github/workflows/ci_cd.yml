name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download data
      run: |
        python src/data/download_data.py

    - name: Preprocess data
      run: |
        python src/data/preprocess.py

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  train:
    name: Model Training
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download data
      run: |
        python src/data/download_data.py

    - name: Preprocess data
      run: |
        python src/data/preprocess.py

    - name: Train model
      run: |
        python src/models/train.py

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-artifacts
        path: models/
        retention-days: 30

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: train

    steps:
    - uses: actions/checkout@v4

    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: model-artifacts
        path: models/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t heart-disease-prediction:${{ github.sha }} .
        docker build -t heart-disease-prediction:latest .

    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-container heart-disease-prediction:latest

        for i in {1..15}; do
          if curl -fsS http://localhost:8000/health; then
            echo "Health check passed"
            docker stop test-container
            docker rm test-container
            exit 0
          fi
          echo "Waiting for application to become healthy..."
          sleep 2
        done

        echo "Container logs:"
        docker logs test-container
        docker stop test-container || true
        docker rm test-container || true
        exit 1


    - name: Save Docker image
      run: |
        docker save heart-disease-prediction:${{ github.sha }} > heart-disease-prediction.tar

    - name: Upload Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: heart-disease-prediction.tar
        retention-days: 30
